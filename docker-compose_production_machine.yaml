
#version: "3.9"

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile_production_machine
    container_name: document_qa_chatbot_system_app_container
    restart: always
    ports:
      - "8000:8000"
    env_file:
      .env
    environment:
      - TZ=Asia/Kolkata   
    volumes:
      - .:/app
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8000"
